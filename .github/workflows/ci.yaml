name: Python CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        # numpy needs to be installed before pyradiomics...
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheel
          python -m pip install torch==2.0.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.24.2
          python -m pip install  --no-build-isolation pyradiomics==3.0.1
          python -m pip install '.[dev]'

      - name: Lint with flake8
        run: |
          flake8 .

      - name: Test with pytest
        run: |
          pytest tests/
